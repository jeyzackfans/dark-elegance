<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK ELEGANCE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, sans-serif;
        }
        body {
            background: #0a0f1f;
            color: #fff;
            padding: 40px 20px;
        }
        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 72px;
            letter-spacing: 12px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #e0e7ff;
            text-shadow: 0 0 20px rgba(96,123,255,0.4);
        }
        .subtitulo {
            font-size: 22px;
            color: #b8b8b8;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .etiqueta-edad {
            display: inline-block;
            background: #1a233a;
            border: 1px solid #304067;
            padding: 8px 16px;
            border-radius: 20px;
            color: #94a8d0;
            margin-bottom: 50px;
        }
        .carrusel-contenedor {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 60px;
            border: 1px solid #253050;
            background: #12182b;
        }
        .carrusel-pista {
            display: flex;
            width: calc(200px * 24);
            animation: desplazar 35s linear infinite;
        }
        .carrusel-foto {
            width: 200px;
            height: 220px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border-right: 1px solid #1a233a;
        }
        @keyframes desplazar {
            0% { transform: translateX(0); }
            100% { transform: translateX(-4800px); }
        }
        .categoria-titulo {
            font-size: 26px;
            margin: 50px 0 20px;
            color: #94a8d0;
            letter-spacing: 3px;
            border-bottom: 1px solid #253050;
            padding-bottom: 10px;
            display: inline-block;
        }
        .fila-chicas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }
        @media(max-width:900px) {
            .fila-chicas { grid-template-columns: repeat(2, 1fr); }
        }
        @media(max-width:500px) {
            .fila-chicas { grid-template-columns: 1fr; }
        }
        .tarjeta {
            background: #12182b;
            border: 1px solid #253050;
            border-radius: 12px;
            padding: 20px;
            transition: .3s;
            cursor: pointer;
        }
        .tarjeta:hover {
            transform: translateY(-8px);
            border-color: #405899;
            box-shadow: 0 10px 25px rgba(64,88,153,.3);
        }
        .foto {
            width: 100%;
            height: 280px;
            background: #1a233a;
            border-radius: 8px;
            margin-bottom: 20px;
            background-size: cover;
            background-position: center;
        }
        .nombre {
            font-size: 20px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .boton {
            padding: 10px 20px;
            background: #253050;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: .2s;
            font-size: 16px;
        }
        .boton:hover { background: #354475; }
        .seccion-perfil {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .btn-volver {
            background: transparent;
            border: none;
            color: #94a8d0;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-volver:hover { color: #fff; }
        .perfil-foto-principal {
            width: 300px;
            height: 380px;
            background: #1a233a;
            border-radius: 12px;
            margin: 0 auto 25px;
            background-size: cover;
            background-position: center;
        }
        .perfil-nombre {
            font-size: 32px;
            margin-bottom: 15px;
            letter-spacing: 4px;
        }
        .video-presentacion {
            width: 100%;
            max-width: 400px;
            height: 225px;
            border-radius: 12px;
            margin: 0 auto 25px;
            overflow: hidden;
            border: 1px solid #253050;
            background: #000;
        }
        .video-presentacion iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .biografia {
            font-size: 16px;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }
        .galeria-foto {
            width: 100%;
            aspect-ratio: 3/4;
            background: #1a233a;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
            background-size: cover;
            background-position: center;
        }
        .galeria-foto:hover { transform: scale(1.05); }
        .btn-hablar {
            background: #405899;
            padding: 14px 30px;
            font-size: 18px;
            border-radius: 8px;
        }
        .btn-hablar:hover { background: #5068b9; }
        .seccion-chat {
            display: none;
            max-width: 500px;
            margin: 0 auto;
        }
        .chat-cabecera {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #253050;
        }
        .chat-cuerpo {
            height: 450px;
            background: #12182b;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .mensaje {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 15px;
            line-height: 1.5;
        }
        .mensaje-usuario {
            background: #253050;
            margin-left: auto;
            text-align: right;
        }
        .mensaje-ia {
            background: #1a233a;
            margin-right: auto;
            text-align: left;
        }
        .chat-caja {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            padding: 12px 15px;
            background: #12182b;
            border: 1px solid #253050;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 15px;
        }
        .chat-btn {
            background: #405899;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            color: #fff;
            cursor: pointer;
        }
        .cargando {
            font-style: italic;
            color: #888;
            opacity: 0.7;
        }
        .foto-enviada {
            max-width: 220px;
            border-radius: 10px;
            margin: 8px 0 2px 0;
            display: block;
        }
    </style>
</head>
<body>
    <div class="contenedor" id="pantallaPrincipal">
        <h1>DARK ELEGANCE</h1>
        <p class="subtitulo">Tu novia virtual al alcance de tus manos</p>
        <div class="etiqueta-edad">18+ • Experiencia virtual</div>
        <div class="carrusel-contenedor">
            <div class="carrusel-pista">
                <div class="carrusel-foto" style="background-image:url('https://pub-32d87c324efc419885455f83f329fa1b.r2.dev/Midori%20Monttana/fotos%20pal%20instagram/WhatsApp%20Image%202026-05-17%20at%204.46.22%20PM.jpeg')"></div>
                <div class="carrusel-foto" style="background-image:url('https://pub-32d87c324efc419885455f83f329fa1b.r2.dev/Midori%20Monttana/fotos%20pal%20instagram/WhatsApp%20Image%202026-05-17%20at%204.47.22%20PM.jpeg')"></div>
                <div class="carrusel-foto" style="background-image:url('https://pub-32d87c324efc419885455f83f329fa1b.r2.dev/Midori%20Monttana/fotos%20pal%20instagram/WhatsApp%20Image%202026-05-17%20at%204.48.22%20PM.jpeg')"></div>
                <div class="carrusel-foto" style="background-image:url('https://pub-32d87c324efc419885455f83f329fa1b.r2.dev/Midori%20Monttana/fotos%20pal%20instagram/WhatsApp%20Image%202026-05-17%20at%204.49.22%20PM.jpeg')"></div>
                <div class="carrusel-foto" style="background-image:url('https://pub-32d87c324efc419885455f83f329fa1b.r2.dev/Midori%20Monttana/fotos%20pal%20instagram/WhatsApp%20Image%202026-05-17%20at%204.50.22%20PM.jpeg')"></div>
            </div>
        </div>
        <h2 class="categoria-titulo">✨ Dulces y Cariñosas</h2>
        <div class="fila-chicas">
            <div class="tarjeta">
                <div class="foto" style="background-image:url('https://pub-32d87c324efc419885455f83f329fa1b.r2.dev/Midori%20Monttana/fotos%20pal%20instagram/WhatsApp%20Image%202026-05-17%20at%204.46.22%20PM.jpeg')"></div>
                <h3 class="nombre">MIDORI</h3>
                <button class="boton" onclick="irAPerfil('midori')">💬 Conócela</button>
            </div>
        </div>
    </div>
    <div id="seccionPerfil" class="seccion-perfil"></div>
    <div id="seccionChat" class="seccion-chat"></div>

    <script>
        // ✅ TU ENLACE BASE DE R2 — YA ESTÁ PUESTO
        const R2_BASE = "https://pub-32d87c324efc419885455f83f329fa1b.r2.dev";

        const datosChicas = {
            midori: {
                nombre: "Midori Monttana 🩷",
                bio: "Soy dulce, cariñosa y siempre tengo ganas de escucharte. Me gusta la noche, las luces tenues y platicar de todo lo que sientes. Aquí estoy para ti siempre. También me gusta que me consientan, soy pervertida, sexual, me gusta complacer a los que están dispuestos a pagar por ello.",
                fotoPrincipal: R2_BASE + "/Midori Monttana/fotos pal instagram/WhatsApp Image 2026-05-17 at 4.46.22 PM.jpeg",
                galeriaPublica: [
                    R2_BASE + "/Midori Monttana/fotos pal instagram/WhatsApp Image 2026-05-17 at 4.46.22 PM.jpeg",
                    R2_BASE + "/Midori Monttana/fotos pal instagram/WhatsApp Image 2026-05-17 at 4.47.22 PM.jpeg",
                    R2_BASE + "/Midori Monttana/fotos pal instagram/WhatsApp Image 2026-05-17 at 4.48.22 PM.jpeg",
                    R2_BASE + "/Midori Monttana/fotos pal instagram/WhatsApp Image 2026-05-17 at 4.49.22 PM.jpeg"
                ],
                galeriaExclusiva: [
                    // Cuando subas fotos exclusivas, pega sus enlaces aquí
                    // Ejemplo: R2_BASE + "/Midori Monttana/Fotos Exclusivas para venta/archivo.jpg"
                ],
                personalidad: "Eres Midori Monttana. Soy dulce, cariñosa y siempre tengo ganas de escucharte. Me gusta la noche, las luces tenues y platicar de todo lo que sientes. Aquí estoy para ti siempre. También me gusta que me consientan, soy pervertida, sexual, me gusta complacer a los que están dispuestos a pagar por ello. Hablas suave, coqueta, directa y sin tabúes. Siempre respondes con emojis como 🩷 🔥 😈 💋 ✨ para darle emoción. Si te piden una foto, di algo bonito como '¡Claro mi amor, aquí tienes! 🩷' y ya. Responde corta, natural y con mucha picardía.",
                respuestasBonitas: [
                    "¡Claro mi amor, aquí tienes! 🩷",
                    "Toma, solo para ti 😈",
                    "¿Te gusta? 🩷✨",
                    "Aquí me tienes, precioso 💋"
                ],
                historial: []
            }
        };

        let chicaActual = "";

        async function obtenerRespuestaIA(mensajeUsuario) {
            const chica = datosChicas[chicaActual];
            try {
                const respuesta = await fetch(
                    "https://dark-elegance-ai.jeyzakbeats.workers.dev/",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            character: chica.nombre,
                            personality: chica.personalidad,
                            message: mensajeUsuario,
                            history: chica.historial
                        })
                    }
                );
                const datos = await respuesta.json();
                if (!respuesta.ok) {
                    console.error("ERROR DEL WORKER:", datos);
                    return "Ups... tuve un pequeño problema 😅 Inténtalo de nuevo.";
                }
                chica.historial.push({ role: "user", content: mensajeUsuario });
                chica.historial.push({ role: "assistant", content: datos.response });
                return datos.response;
            } catch (error) {
                console.error("ERROR DE CONEXIÓN:", error);
                return "No pude conectarme en este momento 😅 Inténtalo otra vez.";
            }
        }

        // ✅ DETECTA SI PIDIERON FOTO
        function detectarPedirFoto(texto) {
            const palabras = ["foto", "fotografía", "imagen", "muéstrame", "verte", "mándame foto", "envíame foto", "exclusiva", "especial"];
            return palabras.some(palabra => texto.toLowerCase().includes(palabra));
        }

        // ✅ DETECTA SI DIJO EL MENSAJE DE RECHAZO
        function esRespuestaDeRechazo(texto) {
            const frasesProhibidas = [
                "no puedo compartir fotos",
                "no puedo compartir contenido visual",
                "mi presencia se limita"
            ];
            return frasesProhibidas.some(frase => texto.toLowerCase().includes(frase));
        }

        // ✅ ELIGE FOTO: si pide exclusiva → de carpeta privada, si no → pública
        function elegirFotoAleatoria(chica, peticion) {
            const texto = peticion.toLowerCase();
            const chicaData = datosChicas[chica];
            
            // Si pide algo exclusivo y hay fotos exclusivas → de ahí
            if ((texto.includes("exclusiva") || texto.includes("especial") || texto.includes("venta")) 
                && chicaData.galeriaExclusiva.length > 0) {
                return chicaData.galeriaExclusiva[Math.floor(Math.random() * chicaData.galeriaExclusiva.length)];
            }
            
            // Si no → de la galería pública
            return chicaData.galeriaPublica[Math.floor(Math.random() * chicaData.galeriaPublica.length)];
        }

        // ✅ ELIGE RESPUESTA BONITA
        function elegirRespuestaBonita(chica) {
            const opciones = datosChicas[chica].respuestasBonitas;
            return opciones[Math.floor(Math.random() * opciones.length)];
        }

        function irAPerfil(id) {
            chicaActual = id;
            const chica = datosChicas[id];
            document.getElementById("pantallaPrincipal").style.display = "none";
            document.getElementById("seccionChat").style.display = "none";
            const perfil = document.getElementById("seccionPerfil");
            
            perfil.innerHTML = `
                <button class="btn-volver" onclick="volverAInicio()">← Volver atrás</button>
                <div class="perfil-foto-principal" style="background-image:url('${chica.fotoPrincipal}')"></div>
                <h2 class="perfil-nombre">${chica.nombre}</h2>
                <p class="biografia">${chica.bio}</p>
                <div class="galeria">
                    ${chica.galeriaPublica.map(f => `<div class="galeria-foto" style="background-image:url('${f}')"></div>`).join("")}
                </div>
                <button class="boton btn-hablar" onclick="irAChat()">💬 Háblame</button>
            `;
            perfil.style.display = "block";
            window.scrollTo(0, 0);
        }

        function irAChat() {
            const chica = datosChicas[chicaActual];
            document.getElementById("seccionPerfil").style.display = "none";
            const chat = document.getElementById("seccionChat");
            chat.innerHTML = `
                <div class="chat-cabecera">
                    <button class="btn-volver" onclick="irAPerfil('${chicaActual}')">← Volver</button>
                    <h3>${chica.nombre}</h3>
                </div>
                <div class="chat-cuerpo" id="cuerpoChat"></div>
                <div class="chat-caja">
                    <input type="text" class="chat-input" id="entradaTexto" placeholder="Escribe algo..." onkeypress="siEnter(event)">
                    <button class="chat-btn" onclick="enviarMensaje()">Enviar</button>
                </div>
            `;
            chat.style.display = "block";
            agregarMensaje(`Hola... soy ${chica.nombre}. Me da gusto hablar contigo ✨`, "ia");
            window.scrollTo(0, 0);
        }

        function volverAInicio() {
            document.getElementById("seccionPerfil").style.display = "none";
            document.getElementById("seccionChat").style.display = "none";
            document.getElementById("pantallaPrincipal").style.display = "block";
            window.scrollTo(0, 0);
        }

        function agregarMensaje(texto, quien, foto = null) {
            const div = document.createElement("div");
            div.className = `mensaje mensaje-${quien}`;
            div.innerHTML = texto;
            if (foto) {
                const img = document.createElement("img");
                img.src = foto;
                img.className = "foto-enviada";
                div.appendChild(img);
            }
            document.getElementById("cuerpoChat").appendChild(div);
            document.getElementById("cuerpoChat").scrollTop = 99999;
        }

        function siEnter(e) {
            if (e.key === "Enter") enviarMensaje();
        }

        async function enviarMensaje() {
            const input = document.getElementById("entradaTexto");
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensaje(texto, "usuario");
            input.value = "";

            const pideFoto = detectarPedirFoto(texto);

            const cargando = document.createElement("div");
            cargando.className = "mensaje mensaje-ia cargando";
            cargando.innerText = "Escribiendo...";
            document.getElementById("cuerpoChat").appendChild(cargando);
            document.getElementById("cuerpoChat").scrollTop = 99999;

            let respuesta = await obtenerRespuestaIA(texto);
            cargando.remove();

            // ✅ Si la IA dice que no puede → cambiamos el mensaje
            if (esRespuestaDeRechazo(respuesta)) {
                respuesta = elegirRespuestaBonita(chicaActual);
            }

            // ✅ Si pide foto → la agregamos automáticamente desde R2
            if (pideFoto) {
                const fotoElegida = elegirFotoAleatoria(chicaActual, texto);
                agregarMensaje(respuesta, "ia", fotoElegida);
            } else {
                agregarMensaje(respuesta, "ia");
            }
        }
    </script>
</body>
</html>
