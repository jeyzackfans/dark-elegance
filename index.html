        @media(max-width: 500px) { .fila-chicas { grid-template-columns: 1fr; } }
        .tarjeta-chica { background: #12182b; border: 1px solid #253252; border-radius: 12px; padding: 20px; transition: .3s; cursor: pointer; }

        .nombre-chica { font-size: 20px; letter-spacing: 3px; margin-bottom: 10px; }
        .boton { padding: 10px 20px; background: #253252; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: .2s; font-size: 16px; }
        .boton:hover { background: #35487a; }
        .seccion-perfil { display: none; max-width: 800px; margin: 0 auto; text-align: center; }
        .boton-volver { background: transparent; border: none; color: #94a8c8; font-size: 16px; cursor: pointer; margin-bottom: 30px; display: inline-flex; align-items: center; gap: 8px; }

        .biografia { font-size: 16px; line-height: 1.8; color: #ccc; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .galeria { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 40px; }
        .foto-galeria { width: 100%; aspect-ratio: 3/4; background: #1a233a; border-radius: 8px; cursor: pointer; transition: .2s; background-size: cover; background-position: center; }
        .foto-galeria:hover { transform: scale(1.05); }
        .boton-hablar { background: #405899; padding: 14px 30px; font-size: 18px; border-radius: 8px; }
        .boton-hablar:hover { background: #5068b0; }
        .seccion-chat { display: none; max-width: 500px; margin: 0 auto; }
        .cabecera-chat { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #253252; }

        .mensaje { margin-bottom: 12px; padding: 8px 12px; border-radius: 18px; max-width: 80%; font-size: 15px; line-height: 1.5; }
