        .subtitulo {

            color: #b8b8b8;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .etiqueta-edad {
            display: inline-block;

            border: 1px solid #304067;
            padding: 8px 16px;
            border-radius: 20px;
            color: #94a8d0;
            margin-bottom: 50px;
        }
        .carrusel-contenedor {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 60px;
            border: 1px solid #253050;
            background: #12182b;
        }
        .carrusel-pista {
            display: flex;
            width: calc(200px * 24);
            animation: desplazar 35s linear infinite;
        }
        .carrusel-foto {
            width: 200px;
            height: 220px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border-right: 1px solid #1a233a;
        }
        @keyframes desplazar {
            0% { transform: translateX(0); }
            100% { transform: translateX(-4800px); }
        }
        .categoria-titulo {
            font-size: 26px;
            margin: 50px 0 20px;

            letter-spacing: 3px;
            border-bottom: 1px solid #253050;
            padding-bottom: 10px;

        .fila-chicas {

            margin-bottom: 40px;

        }
        .boton {

            color: #fff;

            cursor: pointer;
            transition: .2s;

        }
        .boton:hover { background: #354475; }
        .seccion-perfil {

        }
        .btn-volver {

        .perfil-foto-principal {

            border: 1px solid #253050;
            background: #000;

        .video-presentacion iframe {
            width: 100%;

        }
        .biografia {

        .galeria {

        .galeria-foto {

        .btn-hablar {

        .seccion-chat {

        .mensaje-ia {
            background: #1a233a;
            margin-right: auto;

        }
        .chat-caja {

        }
        .chat-input {
            flex: 1;
            padding: 12px 15px;
            background: #12182b;
            border: 1px solid #253050;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 15px;

        .chat-btn {

            color: #fff;

        }

            border-radius: 10px;

</head>

        let chicaActual = "";

        async function obtenerRespuestaIA(mensajeUsuario) {
            const chica = datosChicas[chicaActual];
            try {
                const respuesta = await fetch(
                    "https://dark-elegance-ai.jeyzakbeats.workers.dev/",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            character: chica.nombre,
                            personality: chica.personalidad,
                            message: mensajeUsuario,
                            history: chica.historial
                        })
                    }
                );
                const datos = await respuesta.json();
                if (!respuesta.ok) {
                    console.error("ERROR DEL WORKER:", datos);
                    return "Ups... tuve un pequeño problema 😅 Inténtalo de nuevo.";
                }
                chica.historial.push({ role: "user", content: mensajeUsuario });
                chica.historial.push({ role: "assistant", content: datos.response });
                return datos.response;
            } catch (error) {
                console.error("ERROR DE CONEXIÓN:", error);
                return "No pude conectarme en este momento 😅 Inténtalo otra vez.";
            }
        }

            const palabras = ["foto", "fotografía", "imagen", "muéstrame", "verte", "mándame foto", "envíame foto"];
            return palabras.some(palabra => texto.toLowerCase().includes(palabra));
        }

        function volverAInicio() {

            window.scrollTo(0, 0);
        }

        function agregarMensaje(texto, quien, foto = null) {
            const div = document.createElement("div");
            div.className = `mensaje mensaje-${quien}`;
            div.innerHTML = texto;
            // Si hay foto, la agregamos debajo
            if (foto) {
                const img = document.createElement("img");
                img.src = foto;
                img.className = "foto-enviada";
                div.appendChild(img);
            }
            document.getElementById("cuerpoChat").appendChild(div);
            document.getElementById("cuerpoChat").scrollTop = 99999;
        }

        function siEnter(e) {
            if (e.key === "Enter") enviarMensaje();
        }

            // ✅ SI PIDIÓ FOTO, LA AGREGAMOS NOSOTROS AUTOMÁTICAMENTE
            if (pideFoto) {
                const fotoElegida = elegirFotoAleatoria(chicaActual);
                agregarMensaje(respuesta, "ia", fotoElegida);
            } else {
                agregarMensaje(respuesta, "ia");
            }
        }
    </script>
